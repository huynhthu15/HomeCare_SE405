global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Discovers every API replica through Docker DNS (the `api` name resolves to all of them)
  - job_name: homecare-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 4000
        refresh_interval: 15s
