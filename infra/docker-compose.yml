# Local development dependencies. Start with:  pnpm infra:up
# The API and web app run on the host (pnpm dev) and talk to these containers.
# For the full load-balanced stack (Nginx + N API replicas + worker) see docker-compose.stack.yml.
name: homecare

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homecare
      POSTGRES_PASSWORD: homecare
      POSTGRES_DB: homecare
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homecare -d homecare']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every outgoing email in dev. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # S3-compatible object storage for job photos. Console: http://localhost:9001 (homecare / homecare-secret)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: homecare
      MINIO_ROOT_PASSWORD: homecare-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
