# HomeCare edge: L7 load balancer in front of N stateless API replicas + SPA static hosting.
# Design notes: docs/architecture/system-design.md#load-balancing

worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # JSON access log: shows which replica served each request (upstream_addr) for the LB demo
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"upstream":"$upstream_addr","upstream_rt":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log json;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's embedded DNS: re-resolve `api` so scaling replicas up/down is picked up without reload
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api_upstream {
    zone api_upstream 64k;
    least_conn;                       # long-lived WebSockets make least_conn fairer than round-robin
    server api:4000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # Edge rate limit (coarse, per IP). Fine-grained per-route limits live in the API (Redis-backed).
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /lb-health {
      access_log off;
      return 200 "ok\n";
    }

    # REST API -> any healthy replica (stateless: JWT + Redis-backed revocation/rate limits)
    location /api/ {
      limit_req zone=api_per_ip burst=60 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # Retry another replica only for failures that cannot have side effects
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    # Realtime (Socket.IO). Clients use transports: ['websocket'] so no sticky sessions are needed;
    # events reach users connected to other replicas through the Socket.IO Redis adapter.
    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Internal endpoints are never exposed through the edge
    location ~ ^/(metrics|health/) {
      return 404;
    }

    # SPA
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
