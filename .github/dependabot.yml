version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      prisma: { patterns: ['prisma', '@prisma/*'] }
      react: { patterns: ['react', 'react-dom', '@types/react*', 'react-router'] }
      tooling:
        { patterns: ['eslint*', 'typescript*', 'prettier', 'vite', 'vitest', 'jest', 'ts-jest'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/api, /infra/nginx]
    schedule: { interval: weekly }
